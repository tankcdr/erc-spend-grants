[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
# Pinned so the bytecode and its metadata do not move with Foundry's default. The registry and executors
# need Shanghai (PUSH0); the redemption enforcer needs Cancun (transient storage).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./vectors" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 16
fail_on_revert = true

[lint]
# SpendGrantHash mirrors the ERC's EIP-712 definitions line by line; keep it in
# plain Solidity. Most of the hashes are compile-time constants.
exclude_lints = ["asm-keccak256"]
# Halmos requires the `check_` prefix; the fork tests mirror MetaMask's constant getter names.
ignore = ["test/symbolic/*.sol", "test/fork/*.sol"]
